# 上海保险招标提醒 — 配置文件
# 改完保存即可，下次运行生效。邮箱账号和授权码不放这里，放在 .env 文件里。

[filter]
# 标题里包含任意一个关键词就算命中
# 「医疗保障」用来接住「员工综合医疗保障」这类不带「险」字的团体保险项目
# 「一切险」用来接住「建筑安装工程一切险」这类工程保险项目（机场、市政项目常见）
# 「综合险」「医责险」「安责险」等简称用来接住不写「保险」全称的招标（如「残疾人阳光综合险」）
keywords = ["保险", "车险", "意外险", "责任险", "财产险", "一切险", "综合险",
            "医责险", "安责险", "董责险", "企财险", "雇主险", "团意险", "机损险", "船舶险",
            "补充医疗", "医疗保障", "承保"]

# 标题里包含任意一个排除词就丢弃（防误报）
exclude = ["社会保险缴纳", "社会保险费", "社保代缴", "保险柜", "保险箱", "保险丝", "保险杠",
           "保险资管", "保险兼业代理",  # 券商采购保险相关的 IT 系统，不是买保险
           "虚拟仿真",  # 高校采购保险专业虚拟仿真教学系统，不是买保险
           "医疗保障局", "医疗保障事务", "医疗保障信息平台"]  # 医保部门自己的采购和 IT 运维

# 全国性来源按地区筛选：地区字段、采购单位或标题里包含其中之一才保留
regions = ["上海"]

# 要提醒的公告类型：
#   tender     = 招标/采购公告（含磋商、谈判、询价、单一来源公示）
#   correction = 更正/变更/澄清公告
#   result     = 中标/成交/结果公告、废标/终止公告
#   intent     = 采购意向公开（比正式招标早几个月，可以提前准备）
#   other      = 认不出类型的公告（保留以防漏报）
kinds = ["tender", "correction", "other"]

# 只看最近几天发布的公告；首次运行会把这段时间内命中的公告一次性发出来
lookback_days = 30

[sources]
# 启用的数据来源，不需要的删掉即可：
#   zfcg_sh     = 上海政府采购网（上海各级政府采购）
#   airport     = 上海机场集团·阳光采购（机场集团及下属单位，保险类约 2–4 条/年）
#   shggzy      = 上海公共资源交易平台·国企采购（上海国企）
#   shggzy_zhcg = 上海公共资源交易平台·综合采购（机场、地铁、医院、街镇等，保险类公告最多）
#   shmetro     = 上海申通地铁·采购电子商务平台（用本机 Chrome 无头渲染公开首页；robots 例外，用户 2026-10-31 授权）
#   ceair       = 东方航空·集采实施平台（东航集团在上海的采购，外地分公司已过滤）
#   bosc        = 上海银行·官网招标采购（外地分行已过滤）
#   gtht        = 国泰海通·供应商门户
#   srcb        = 上海农商银行·供应商门户
#   ebscn       = 光大证券·集中采购管理平台
#   baowu       = 中国宝武·宝华智慧招标共享平台（只保留上海项目）
#   cosco       = 中远海运·集团采购信息系统（只保留上海项目）
#   chengtou    = 上海城投集团·招采服务平台（城投集团及下属单位，低频补充来源）
#   sse         = 上海证券交易所·采购门户（上交所及下属公司，每年几条财产险、车险、员工补充医疗）
#   （cfcpn = 金采网·金融集中采购网，2026-11-11 用户要求停用：都是金融机构发布的。代码还在，想恢复就把 "cfcpn" 加回 enabled）
#   edu         = 上海高校·采购招标公告（29 所高校各自的采购网站，主要给全量存档用；学校名单在 tender_alert/sources/edu.py）
#   orgs        = 上海企事业单位·自有采购网站（21 家：SMG、复旦肿瘤医院、复旦华山医院、中科院上海高研院/有机所/微系统所、中国银联、上海清算所、上期所、上金所、城银清算、CIPS、中银国际证券、上海国际信托、上海地产集团，以及上海国际招标/中世建咨/机电设备招标/财瑞/百通 5 家代理机构、中烟平台上海项目；名单在 tender_alert/sources/orgs.py）
#   ccgp        = 中国政府采购网（补充在上海的中央单位）
# 排在前面的来源优先：同一条公告在多个网站出现时，只按第一个来源提醒一次。
enabled = ["zfcg_sh", "airport", "shggzy", "shggzy_zhcg", "shmetro", "ceair", "bosc", "gtht", "srcb", "ebscn", "baowu", "cosco", "chengtou", "sse", "edu", "orgs", "ccgp"]

# 更新慢的来源每天只抓一次：当天抓成功过，后面两次运行就跳过（当天还没成功的会自动补抓）。
# 没列在这里的来源每次运行都抓。分法依据的是 2026-11 上旬每个来源每个工作日的发布量：
#   每次都抓：zfcg_sh（约 930 条/天）、shggzy_zhcg（约 140，且一次最多只能看最新 100 条）、ccgp（约 65）、
#             ceair（约 50）、shmetro（约 20，但每个栏目只显示最新 10 条，抓少了会漏）
#   每天一次：下面这些。多数每天不到 10 条；edu 合计约 70 条但分散在 29 所学校，baowu 约 20 条，都能按日期补全，晚半天不会漏
once_a_day = ["airport", "shggzy", "bosc", "gtht", "srcb", "ebscn", "baowu", "cosco", "chengtou", "sse", "edu", "orgs"]

# 对同一个网站，两次请求之间至少间隔几秒（别调太小，容易被封）
request_interval = 2.0

[archive]
# 全量存档：把每次抓到的所有上海公告（不限保险、不限类型）都存进数据库的 archive 表，供后续检索分析。
# 打开后，按公告类型抓取的来源会抓全部类型（包括中标结果），请求会多一些；保险提醒邮件不受影响。
enabled = true

[alert]
# 某个来源连续失败几次后，在邮件里告警（网站改版或被限流时会出现）
failure_threshold = 3
